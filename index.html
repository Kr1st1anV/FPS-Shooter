<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crosshair-wrapper">
        <div class="crosshair">
            <div class="line top"></div>
            <div class="line bottom"></div>
            <div class="line left"></div>
            <div class="line right"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div id="ammo-container">
        <div class="ammo-svg-wrapper">
            <svg width="80" height="80">
                <circle class="ammo-bg" cx="40" cy="40" r="35"></circle>
                <circle id="ammo-bar" cx="40" cy="40" r="35"></circle>
            </svg>
            <div class="ammo-text">
                <span id="current-ammo">30</span>
                <span class="ammo-separator">/</span>
                <span id="total-ammo">30</span>
            </div>
        </div>
        <div id="reload-prompt">PRESS 'R' TO RELOAD</div>
    </div>
    <div id="hitmarker-container">
        <div class="hit-line tl"></div>
        <div class="hit-line tr"></div>
        <div class="hit-line bl"></div>
        <div class="hit-line br"></div>
    </div>
    <canvas id="muzzle-flash-canvas" width="64" height="64" style="display: none;"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('muzzle-flash-canvas');
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');      // Core
            gradient.addColorStop(0.2, 'rgba(255, 220, 100, 0.9)');  // Inner Glow
            gradient.addColorStop(0.4, 'rgba(255, 100, 0, 0.4)');    // Outer Glow
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');         // Fade out
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
        })();
    </script>
    <script type="module" src="/main.js"></script>
</body>
</html>
